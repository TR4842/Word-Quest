name: Build Android APK

# The single workflow used for continuous checks and APK builds.
on:
  push:
    branches:
      - main
      - '**'
    paths-ignore:
      - '*.xlsx'
      - '*.png'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter analyze · test · build apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (static checks)
        run: flutter analyze --no-pub

      - name: Unit tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Collect APK
        run: |
          mkdir -p apk-artifact
          cp build/app/outputs/flutter-apk/app-release.apk \
             apk-artifact/WordQuest-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordQuest-APK
          path: apk-artifact/WordQuest-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14
