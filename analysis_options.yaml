# CI runs `flutter analyze` with fatal infos. Only fail on real Dart errors.
analyzer:
  errors:
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    unused_element: ignore
    unused_field: ignore
    unused_import: ignore
    unused_local_variable: ignore
    unused_catch_clause: ignore
    unused_catch_stack: ignore
    dead_code: ignore
    dead_null_aware_expression: ignore
    unnecessary_null_comparison: ignore
    todo: ignore
    include_file_not_found: ignore
    undefined_lint: ignore
    comment_references: ignore
