plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def wordQuestReleaseStoreFile = System.getenv("WORD_QUEST_KEYSTORE_PATH")
def wordQuestReleaseStorePassword = System.getenv("WORD_QUEST_KEYSTORE_PASSWORD")
def wordQuestReleaseKeyAlias = System.getenv("WORD_QUEST_KEY_ALIAS")
def wordQuestReleaseKeyPassword = System.getenv("WORD_QUEST_KEY_PASSWORD")
def wordQuestReleaseSigningValues = [
    wordQuestReleaseStoreFile,
    wordQuestReleaseStorePassword,
    wordQuestReleaseKeyAlias,
    wordQuestReleaseKeyPassword,
]
def hasWordQuestReleaseSigning = wordQuestReleaseSigningValues.every {
    it != null && !it.trim().isEmpty()
}
def hasPartialWordQuestReleaseSigning = wordQuestReleaseSigningValues.any {
    it != null && !it.trim().isEmpty()
}

if (hasPartialWordQuestReleaseSigning && !hasWordQuestReleaseSigning) {
    throw new GradleException("Provide all four WORD_QUEST release-signing environment variables.")
}
if (hasWordQuestReleaseSigning && !rootProject.file(wordQuestReleaseStoreFile).isFile()) {
    throw new GradleException("WORD_QUEST_KEYSTORE_PATH does not point to an existing keystore file.")
}

android {
    namespace = "com.tanvir.wordquest"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Keep this ID stable; with the same signing key Android can install an
        // in-place update and retain the app's existing on-device data.
        applicationId = "com.tanvir.wordquest"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasWordQuestReleaseSigning) {
                storeFile = rootProject.file(wordQuestReleaseStoreFile)
                storePassword = wordQuestReleaseStorePassword
                keyAlias = wordQuestReleaseKeyAlias
                keyPassword = wordQuestReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Use the same private keystore for every distributed release.
            // The debug key fallback is for local development only; CI does not
            // publish an APK unless persistent release signing is configured.
            signingConfig = hasWordQuestReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
